# ============================================================
# Docker Compose - IT Service Assistant
# ============================================================
# One command to start the full stack:
#   docker-compose up -d
#
# Access:
#   - Frontend: http://localhost:3000
#   - Backend API: http://localhost:8000
#   - API Docs: http://localhost:8000/docs

version: '3.8'

services:
  # ============================================================
  # Backend - FastAPI + LangChain + Chroma
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-assistant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - LLM_MODEL=${LLM_MODEL:-doubao-pro-32k-241028}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-doubao-embedding-240715}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-${LLM_BASE_URL}}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # Frontend - Static HTML served by Nginx
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: it-assistant-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local